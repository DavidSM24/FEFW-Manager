name: Comprobar Android

on:
  push:
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle'
      - 'gradle.properties'
      - 'gradlew*'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arranque:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Compilar y ejecutar lint
        run: ./gradlew :app:assembleDebug :app:lintDebug :app:testDebugUnitTest

      - name: Iniciar el emulador de Android 11
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/fefw-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          sdkmanager 'emulator' 'system-images;android-30;default;x86_64'
          avdmanager create avd -n fefw -k 'system-images;android-30;default;x86_64' -d pixel_2 -p "$ANDROID_AVD_HOME/fefw.avd"
          test -s "$ANDROID_AVD_HOME/fefw.avd/config.ini"
          printf 'avd.ini.encoding=UTF-8\npath=%s\ntarget=android-30\n' "$ANDROID_AVD_HOME/fefw.avd" > "$ANDROID_AVD_HOME/fefw.ini"
          adb start-server
          "$ANDROID_HOME/emulator/emulator" -avd fefw -no-window -no-audio -no-snapshot -no-boot-anim -gpu software -no-metrics > "$RUNNER_TEMP/emulator.log" 2>&1 &
          emulator_pid=$!
          for attempt in {1..100}; do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then break; fi
            if [[ "$(timeout 5 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]]; then exit 0; fi
            sleep 3
          done
          tail -100 "$RUNNER_TEMP/emulator.log"
          exit 1

      - name: Verificar la navegación y los datos en Android
        run: |
          adb shell input keyevent KEYCODE_WAKEUP
          adb shell wm dismiss-keyguard
          ./gradlew :app:connectedDebugAndroidTest
