name: Comprobar Android

on:
  push:
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle'
      - 'gradle.properties'
      - 'gradlew*'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arranque:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compilar y ejecutar lint
        run: ./gradlew :app:assembleDebug :app:lintDebug :app:testDebugUnitTest

      - name: Iniciar el emulador de Android 11
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          sdkmanager 'system-images;android-30;default;x86_64'
          echo no | avdmanager create avd -n fefw -k 'system-images;android-30;default;x86_64'
          "${ANDROID_HOME}/emulator/emulator" -avd fefw -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect > "$RUNNER_TEMP/emulator.log" 2>&1 &
          timeout 360 adb wait-for-device
          timeout 300 bash -c 'until [[ "$(adb shell getprop sys.boot_completed | tr -d "\r")" == "1" ]]; do sleep 3; done'

      - name: Instalar el APK y abrir la pantalla inicial
        run: |
          adb install app/build/outputs/apk/debug/app-debug.apk
          adb shell input keyevent KEYCODE_WAKEUP
          adb shell wm dismiss-keyguard
          adb shell am start -W -n com.davidsm24.fefwmanager/.home.MainActivity | tee "$RUNNER_TEMP/arranque.txt"
          grep -F 'Status: ok' "$RUNNER_TEMP/arranque.txt"
          adb shell uiautomator dump /sdcard/fefw-window.xml
          adb pull /sdcard/fefw-window.xml "$RUNNER_TEMP/ventana.xml"
          grep -F 'resource-id="com.davidsm24.fefwmanager:id/app_title"' "$RUNNER_TEMP/ventana.xml"
          grep -F 'text="Cai · Theodora · Dietrich · Leda"' "$RUNNER_TEMP/ventana.xml"
